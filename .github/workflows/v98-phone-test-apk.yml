name: KidsGuard v98 Signed Phone Test APK

on:
  push:
    branches: [release/v1.0.98-play-testing]
    paths: [".github/workflows/v98-phone-test-apk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phone-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platform-tools"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify signing secrets and prepare keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kidsguard-release.jks"
          test -s "$RUNNER_TEMP/kidsguard-release.jks"
      - name: Build signed APK without publishing a release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kidsguard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleGithub --no-daemon --no-configuration-cache
      - name: Verify package, version and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/github/app-github.apk"
          test -s "$APK"
          test "$(apkanalyzer manifest application-id "$APK")" = "secure.kidsguard.app"
          grep -Eq '^[[:space:]]*versionCode = 98$' app/build.gradle.kts
          grep -Eq '^[[:space:]]*versionName = "1.0.98"$' app/build.gradle.kts
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - name: Upload signed phone test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KidsGuard-v1.0.98-Signed-Phone-Test-APK
          path: app/build/outputs/apk/github/app-github.apk
          if-no-files-found: error
          retention-days: 7
