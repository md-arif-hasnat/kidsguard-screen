name: Migrate Verified Parent Owner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-verified-parent-owner.yml"
      - "functions/scripts/transfer-family-owner.js"

permissions:
  contents: read

concurrency:
  group: migrate-verified-parent-owner
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed production source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install locked Firebase Admin dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Validate transfer without writes
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SOURCE_OWNER_EMAIL: freshmartbd123@gmail.com
          TARGET_OWNER_EMAIL: arifhasnat07@gmail.com
          TRANSFER_CONFIRMATION: TRANSFER freshmartbd123@gmail.com TO arifhasnat07@gmail.com
          DRY_RUN: "true"
        run: node scripts/transfer-family-owner.js

      - name: Transfer verified family ownership
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SOURCE_OWNER_EMAIL: freshmartbd123@gmail.com
          TARGET_OWNER_EMAIL: arifhasnat07@gmail.com
          TRANSFER_CONFIRMATION: TRANSFER freshmartbd123@gmail.com TO arifhasnat07@gmail.com
          DRY_RUN: "false"
        run: node scripts/transfer-family-owner.js
