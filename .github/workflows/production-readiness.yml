name: Production Readiness Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parent-child-contracts:
    name: Parent-child contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Verify shared production and Google Play contracts
        run: |
          node scripts/check-parent-child-contracts.mjs
          node scripts/check-google-play-release.mjs

  dashboard:
    name: Parent dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefix web-dashboard --no-audit --no-fund

      - name: Lint and build production dashboard
        run: |
          npm run lint --prefix web-dashboard
          npm run build --prefix web-dashboard

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate --prefix web-dashboard

  functions:
    name: Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Build and run all Functions tests
        run: npm test --prefix functions

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate --prefix functions

  firebase-rules:
    name: Firebase security rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Install locked dependencies
        run: |
          npm ci --prefix web-dashboard --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund

      - name: Build retention worker
        run: npm run build --prefix functions

      - name: Verify Firestore and Storage authorization
        run: >
          npx --yes firebase-tools@15.34.1 emulators:exec
          --only firestore,storage
          --project kidsguard-rules-test
          "node --test --test-concurrency=1 web-dashboard/tests/firestore.rules.test.mjs web-dashboard/tests/storage.rules.test.mjs && node --test functions/tests/retention.test.cjs"

  android:
    name: Child Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compile and test child app
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:bundleRelease --no-configuration-cache
