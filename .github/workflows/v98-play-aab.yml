name: KidsGuard v98 Signed Play AAB Candidate

on:
  push:
    branches: [release/v1.0.98-play-testing]
    paths:
      - ".github/workflows/v98-play-aab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-play-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify secrets are configured
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing signing keystore secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing signing password" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing key alias" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing key password" && exit 1)
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platform-tools"
      - name: Install Android 36 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kidsguard-release.jks"
          test -s "$RUNNER_TEMP/kidsguard-release.jks"
      - name: Build signed Google Play candidate AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kidsguard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --no-configuration-cache
      - name: Verify AAB signature, version and Play permission contract
        shell: bash
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          PLAY_APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$AAB"
          test -s "$PLAY_APK"
          grep -Eq '^[[:space:]]*versionCode = 98$' app/build.gradle.kts
          grep -Eq '^[[:space:]]*versionName = "1.0.98"$' app/build.gradle.kts
          jarsigner -verify "$AAB" | grep -Fq 'jar verified.'
          test "$(apkanalyzer manifest application-id "$PLAY_APK")" = "secure.kidsguard.app"
          if apkanalyzer manifest permissions "$PLAY_APK" | grep -Fqx 'android.permission.REQUEST_INSTALL_PACKAGES'; then
            echo "Play APK must not request sideload install permission"
            exit 1
          fi
          keytool -printcert -jarfile "$AAB" | grep -E 'SHA256:|Owner:'
          sha256sum "$AAB"
      - name: Upload signed AAB for manual Google Play Internal Testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KidsGuard-v1.0.98-Play-Internal-Testing-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
