name: Temporary Paddle Billing Diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-paddle-billing.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout one-time diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a46ee892587d78413532c5f9417f3ca8c027ae69
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Prepare credentials and runtime token
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "PADDLE_DIAGNOSTIC_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          printf '%s\n' \
            'PADDLE_RECURRING_ADDONS_JSON=[]' \
            'PLATFORM_OWNER_EMAIL=freshmartbd123@gmail.com' \
            'INTERNAL_DASHBOARD_URL=https://kidsguard-screen.vercel.app' \
            'RESEND_FROM_EMAIL="KidsGuard <noreply@kidsguard-screen.purevelofood.com>"' \
            "PADDLE_DIAGNOSTIC_TOKEN=$TOKEN" \
            > functions/.env.kidsguard-0626

      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Deploy one-time diagnostic function
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FUNCTIONS_DISCOVERY_TIMEOUT: "60"
        run: >
          npx --yes firebase-tools@15.34.1 deploy
          --project kidsguard-0626
          --only "functions:diagnosePaddleBillingOnce"
          --non-interactive

      - name: Probe production Paddle API
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 \
            -H "Authorization: Bearer $PADDLE_DIAGNOSTIC_TOKEN" \
            "https://us-central1-kidsguard-0626.cloudfunctions.net/diagnosePaddleBillingOnce"

      - name: Delete one-time diagnostic function
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: >
          npx --yes firebase-tools@15.34.1 functions:delete
          diagnosePaddleBillingOnce
          --region us-central1
          --project kidsguard-0626
          --force
