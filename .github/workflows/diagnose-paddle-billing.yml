name: Temporary Paddle Billing Diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-paddle-billing.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-service-account.json"
          gcloud config set project kidsguard-0626

      - name: Probe Paddle transaction read access
        shell: bash
        run: |
          PADDLE_KEY="$(gcloud secrets versions access latest --secret=PADDLE_API_KEY --project=kidsguard-0626)"
          test -n "$PADDLE_KEY"
          export PADDLE_KEY
          node <<'NODE'
          const key = process.env.PADDLE_KEY || "";
          const base = key.includes("_sdbx_")
            ? "https://sandbox-api.paddle.com"
            : "https://api.paddle.com";
          const probes = [
            ["base", "per_page=1"],
            ["status", "per_page=1&status=completed"],
            ["include", "per_page=1&status=completed&include=address"],
            ["order", "per_page=1&status=completed&include=address&order_by=billed_at%5BDESC%5D"],
          ];
          (async () => {
            for (const [name, query] of probes) {
              const response = await fetch(base + "/transactions?" + query, {
                headers: { Authorization: "Bearer " + key },
              });
              const payload = await response.json().catch(() => null);
              console.log(JSON.stringify({
                probe: name,
                status: response.status,
                ok: response.ok,
                count: Array.isArray(payload?.data) ? payload.data.length : undefined,
                errorCode: payload?.error?.code,
                errorDetail: payload?.error?.detail,
              }));
            }
          })().catch((error) => {
            console.error("Probe failed:", error instanceof Error ? error.message : "unknown");
            process.exit(1);
          });
          NODE
