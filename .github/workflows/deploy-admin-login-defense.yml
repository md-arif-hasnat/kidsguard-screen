name: Deploy Admin Security

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-admin-login-defense.yml"
      - "functions/src/index.ts"
      - "functions/src/internalSessionDefense.ts"
      - "functions/tests/internal-session-defense.test.cjs"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firestore.rules.production"
      - "storage.rules"
      - "web-dashboard/app/internal/login/**"
      - "web-dashboard/app/internal/security/login-blocks/**"
      - "web-dashboard/app/internal/security/sessions/**"
      - "web-dashboard/components/InternalSidebar.tsx"
      - "web-dashboard/lib/context/InternalAdminContext.tsx"
      - "web-dashboard/lib/internalSessionSecurity.ts"
      - "web-dashboard/lib/repositories/InternalLoginDefenseRepository.ts"
      - "web-dashboard/next.config.js"
      - "web-dashboard/package.json"
      - "web-dashboard/package-lock.json"
      - "web-dashboard/tests/firestore.rules.test.mjs"
      - "web-dashboard/tests/storage.rules.test.mjs"

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed production source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            web-dashboard/package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          npm ci --prefix functions --no-audit --no-fund
          npm ci --prefix web-dashboard --no-audit --no-fund

      - name: Verify Functions and dashboard
        run: |
          npm run test:security --prefix functions
          npm run build --prefix web-dashboard
          npm audit --omit=dev --audit-level=moderate --prefix functions
          npm audit --omit=dev --audit-level=moderate --prefix web-dashboard

      - name: Verify Firestore rules
        run: >
          npx --yes firebase-tools@15.34.1 emulators:exec
          --only firestore,storage
          --project kidsguard-rules-test
          "node --test --test-concurrency=1 web-dashboard/tests/firestore.rules.test.mjs web-dashboard/tests/storage.rules.test.mjs"

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Prepare production Firebase parameters
        working-directory: functions
        run: |
          printf '%s\n' \
            'PADDLE_RECURRING_ADDONS_JSON=[]' \
            'PLATFORM_OWNER_EMAIL=freshmartbd123@gmail.com' \
            'INTERNAL_DASHBOARD_URL=https://kidsguard-screen.vercel.app' \
            'RESEND_FROM_EMAIL="KidsGuard <noreply@kidsguard-screen.purevelofood.com>"' \
            > .env.kidsguard-0626

      - name: Deploy admin-security Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FUNCTIONS_DISCOVERY_TIMEOUT: "60"
        shell: bash
        run: |
          set +e
          npx --yes firebase-tools@15.34.1 deploy \
            --project kidsguard-0626 \
            --only "functions:requestPlatformStaffAccount,functions:requestPlatformStaffChange,functions:resendPlatformStaffApproval,functions:deactivatePlatformStaff,functions:reviewPlatformStaffRequest,functions:resendPlatformStaffInvite,functions:verifyReleaseArtifact,functions:createPromoCode,functions:setPromoCodeStatus,functions:sendPromoCodeEmail,functions:getInternalLoginGuardStatus,functions:recordInternalLoginFailure,functions:finalizeInternalLogin,functions:assertInternalLoginAccess,functions:listInternalLoginBlocks,functions:approveInternalLoginBlock,functions:endInternalAdminSession,functions:listInternalAdminSessions,functions:revokeInternalAdminSession,functions:onInternalSessionSecurityAlertCreated,functions:getAdminMonthlyBillingReport,functions:getAdminMonthlyBillingReportV2,functions:getAdminMonthlyBillingReportV3,functions:getAdminMonthlyBillingReportV4" \
            --non-interactive 2>&1 | tee "$RUNNER_TEMP/firebase-deploy.log"
          DEPLOY_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$DEPLOY_STATUS" -eq 0 ]; then
            exit 0
          fi
          if grep -Fq \
            "Functions successfully deployed but could not set up cleanup policy" \
            "$RUNNER_TEMP/firebase-deploy.log"; then
            echo "::warning::Deployment succeeded; artifact cleanup policy remains intentionally unchanged."
            exit 0
          fi
          exit "$DEPLOY_STATUS"

      - name: Deploy Firestore and Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: >
          npx --yes firebase-tools@15.34.1 deploy
          --project kidsguard-0626
          --only "firestore:rules,storage"
          --non-interactive

