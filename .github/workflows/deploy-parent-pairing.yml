name: Deploy Parent Pairing Functions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-parent-pairing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-parent-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install and verify Firebase Functions
        run: |
          npm ci --prefix functions --no-audit --no-fund
          npm run build --prefix functions
          npm run test:security --prefix functions

      - name: Prepare Firebase production parameters
        working-directory: functions
        run: |
          printf '%s\n' \
            'PADDLE_RECURRING_ADDONS_JSON=[]' \
            'PLATFORM_OWNER_EMAIL=freshmartbd123@gmail.com' \
            'INTERNAL_DASHBOARD_URL=https://kidsguard-screen.vercel.app' \
            'RESEND_FROM_EMAIL="KidsGuard <noreply@kidsguard-screen.purevelofood.com>"' \
            'GOOGLE_PLAY_PACKAGE_NAME=secure.kidsguard.app' \
            'GOOGLE_PLAY_SUBSCRIPTION_PRODUCT_ID=kidsguard_family' \
            'GOOGLE_PLAY_RTDN_TOPIC=google-play-rtdn' \
            > .env.kidsguard-0626

      - name: Deploy only parent pairing callables
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || {
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON repository secret is missing"
            exit 1
          }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$RUNNER_TEMP/firebase-service-account.json"' EXIT
          npx --yes firebase-tools@15.34.1 deploy \
            --project kidsguard-0626 \
            --only "functions:ensureParentFamily,functions:acceptPairingCode" \
            --non-interactive --force

      - name: Confirm deployment completed
        run: echo "Both parent pairing functions deployed; physical-device test is still required."
