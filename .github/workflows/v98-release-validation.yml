name: KidsGuard v98 Release Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "functions/**"
      - "firestore.rules*"
      - ".github/workflows/v98-release-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Compile and execute unit tests
        run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Retention test using Firestore emulator
        working-directory: .
        run: npx --yes firebase-tools@14 emulators:exec --only firestore "cd functions && npm run test:retention"

  firestore-rules-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
        working-directory: web-dashboard
      - name: Run Firestore emulator tests
        run: npx --yes firebase-tools@14 --project kidsguard-rules-test emulators:exec --only firestore "node web-dashboard/tests/firestore.rules.test.mjs"
      - name: Run Storage emulator tests
        run: npx --yes firebase-tools@14 --project kidsguard-rules-test emulators:exec --only firestore,storage "node web-dashboard/tests/storage.rules.test.mjs"

  android-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew
      - name: Compile Android GitHub variant (test only, no release)
        run: ./gradlew assembleGithub --no-daemon --no-configuration-cache
