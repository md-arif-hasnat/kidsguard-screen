name: Build and Release KidsGuard APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not read versionName/versionCode"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "KidsGuard $TAG already exists. No APK build will run."
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "KidsGuard $TAG is new. Release build will run."
          fi

      - name: Verify release secrets
        if: steps.guard.outputs.release_needed == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret." && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret." && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret." && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret." && exit 1)
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON repository secret." && exit 1)
          test -n "$YOUTUBE_API_KEY" || (echo "Missing YOUTUBE_API_KEY repository secret." && exit 1)

      - name: Prepare release signing key
        if: steps.guard.outputs.release_needed == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kidsguard-release.jks"
          test -s "$RUNNER_TEMP/kidsguard-release.jks"

      - name: Build signed release APK
        if: steps.guard.outputs.release_needed == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kidsguard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK
        if: steps.guard.outputs.release_needed == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          sha256sum "$APK"

      - name: Prepare release metadata
        if: steps.guard.outputs.release_needed == 'true'
        id: metadata
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          SIZE=$(du -h "$APK" | cut -f1)
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          {
            echo "## KidsGuard v$VERSION_NAME"
            echo
            echo "- **Version:** $VERSION_NAME"
            echo "- **Version Code:** $VERSION_CODE"
            echo "- **APK Size:** $SIZE"
            echo "- **Change:** $COMMIT_SUBJECT"
            echo
            echo "### Release Notes"
            echo
            echo "- $COMMIT_SUBJECT"
          } > release-notes-generated.md
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMIT_SUBJECT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.guard.outputs.release_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KidsGuard-release-apk-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create and publish GitHub Release
        if: steps.guard.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          TAG="v$VERSION_NAME"
          APK="app/build/outputs/apk/release/app-release.apk"
          gh release create "$TAG" "$APK#KidsGuard-v$VERSION_NAME.apk"             --title "KidsGuard v$VERSION_NAME"             --notes-file release-notes-generated.md             --repo "$GITHUB_REPOSITORY"

      - name: Sync release to Firestore
        if: steps.guard.outputs.release_needed == 'true'
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version_name }}/KidsGuard-v${{ steps.version.outputs.version_name }}.apk
          APK_SIZE: ${{ steps.metadata.outputs.size }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
        run: |
          npm ci
          node scripts/publish-release.js
