name: Build and Release KidsGuard Android Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reject tracked signing material
        shell: bash
        run: |
          TRACKED_SIGNING_FILES=$(git ls-files '*.jks' '*.keystore' 'key.properties' 'keystore.properties' 'signing.properties')
          if [ -n "$TRACKED_SIGNING_FILES" ]; then
            echo "Release signing material must not be committed:"
            echo "$TRACKED_SIGNING_FILES"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not read versionName/versionCode"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "KidsGuard $TAG already exists. No Android build will run."
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "KidsGuard $TAG is new. Release build will run."
          fi

      - name: Verify release secrets
        if: steps.guard.outputs.release_needed == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret." && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret." && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret." && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret." && exit 1)
          test -n "$YOUTUBE_API_KEY" || (echo "Missing YOUTUBE_API_KEY repository secret." && exit 1)

      - name: Prepare release signing key
        if: steps.guard.outputs.release_needed == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kidsguard-release.jks"
          test -s "$RUNNER_TEMP/kidsguard-release.jks"

      - name: Build signed release APK and Play AAB
        if: steps.guard.outputs.release_needed == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kidsguard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify Android release artifacts
        if: steps.guard.outputs.release_needed == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          sha256sum "$APK" "$AAB"

      - name: Prepare release metadata
        if: success()
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ -s "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
          else
            RELEASE_DIR="$RUNNER_TEMP/kidsguard-release-$VERSION_NAME"
            mkdir -p "$RELEASE_DIR"
            gh release download "v$VERSION_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern '*.apk' \
              --dir "$RELEASE_DIR" \
              --clobber
            APK=$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' | head -1)
            test -s "$APK"
            SIZE_BYTES=$(stat -c%s "$APK")
            SIZE="$SIZE_BYTES bytes"
          fi
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          {
            echo "## KidsGuard v$VERSION_NAME"
            echo
            echo "- **Version:** $VERSION_NAME"
            echo "- **Version Code:** $VERSION_CODE"
            echo "- **APK Size:** $SIZE"
            echo "- **Change:** $COMMIT_SUBJECT"
            echo
            echo "### Release Notes"
            echo
            echo "- $COMMIT_SUBJECT"
          } > release-notes-generated.md
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMIT_SUBJECT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.guard.outputs.release_needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KidsGuard-release-apk-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play AAB artifact
        if: steps.guard.outputs.release_needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KidsGuard-play-aab-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Create and publish GitHub Release
        if: steps.guard.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          TAG="v$VERSION_NAME"
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          gh release create "$TAG" \
            "$APK#KidsGuard-v$VERSION_NAME.apk" \
            "$AAB#KidsGuard-v$VERSION_NAME.aab" \
            --title "KidsGuard v$VERSION_NAME" \
            --notes-file release-notes-generated.md \
            --repo "$GITHUB_REPOSITORY"

      - name: Sync release to Firestore
        if: success()
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version_name }}/app-release.apk
          APK_SIZE: ${{ steps.metadata.outputs.size }}
          APK_SHA256: ${{ steps.metadata.outputs.sha256 }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured; skipping optional Firestore release sync."
            exit 0
          fi
          npm ci
          node scripts/publish-release.js
